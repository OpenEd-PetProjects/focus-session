<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сессия — фокус-таймер</title>
  <style>
    body { font: 1rem system-ui, sans-serif; background: #f3f2ff; color: #25203c; margin: 0; }
    main { max-width: 24rem; margin: 12vh auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 8px 30px #29204a18; }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: .5rem; }
    input, button { font: inherit; padding: .6rem; border: 1px solid #9991ad; border-radius: .4rem; }
    input { width: 6rem; }
    output { display: block; font-size: 3.5rem; font-variant-numeric: tabular-nums; margin: 1rem 0; }
    button { cursor: pointer; background: #5140da; color: white; border-color: #5140da; margin-right: .5rem; }
    button:disabled { opacity: .5; cursor: default; }
    @media (max-width: 30rem) { main { margin: 1rem; } }
  </style>
  <script src="timer.js" defer></script>
</head>
<body>
  <main>
    <h1>Сессия</h1>
    <label for="duration">Длительность (минуты)</label>
    <input id="duration" type="number" min="1" max="300" step="1" value="25" required>
    <output id="display" aria-label="Оставшееся время">25:00</output>
    <button id="start" type="button">Старт</button>
    <button id="pause" type="button" disabled>Пауза</button>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
